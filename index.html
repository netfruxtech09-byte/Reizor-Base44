    <style id="app-bootstrap">
      /* Reizor dark theme applied before the CSS bundle loads — prevents white flash on startup */
      html, body { background-color: #080a17; margin: 0; min-height: 100%; }
      #root { background-color: #080a17; min-height: 100vh; }
      #app-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background-color: #080a17;
        background-image: radial-gradient(circle at 50% 38%, rgba(255,27,141,0.10), transparent 60%);
        transition: opacity 0.45s ease;
        -webkit-font-smoothing: antialiased;
      }
      #app-splash.fade-out { opacity: 0; pointer-events: none; }
      #app-splash-logo {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 900; font-size: 34px; letter-spacing: 0.04em;
        background: linear-gradient(90deg, #ff1b8d, #1e64ff);
        -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
      }
      #app-splash-spinner {
        width: 26px; height: 26px;
        border: 3px solid rgba(255,255,255,0.12); border-top-color: #ff1b8d;
        border-radius: 50%; animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-splash-spinner { animation: none; } }
    </style>

    <script>
      // Block auto-triggered geolocation prompts that show Base44 domain branding.
      // Only allow geolocation AFTER a real user gesture (click/tap).
      // This prevents the duplicate "base44.app would like to use your location" popup
      // while still allowing user-initiated location requests (e.g. DiscoveryFilters).
      (function() {
        if (!navigator.geolocation) return;
        var _getPos = navigator.geolocation.getCurrentPosition.bind(navigator.geolocation);
        var _watch = navigator.geolocation.watchPosition.bind(navigator.geolocation);
        var _interacted = false;
        function mark() { _interacted = true; }
        document.addEventListener('click', mark, { once: true, passive: true });
        document.addEventListener('touchend', mark, { once: true, passive: true });
        navigator.geolocation.getCurrentPosition = function(s, e, o) {
          if (!_interacted) { if (e) e({ code: 1, message: 'User interaction required' }); return; }
          return _getPos(s, e, o);
        };
        navigator.geolocation.watchPosition = function(s, e, o) {
          if (!_interacted) { if (e) e({ code: 1, message: 'User interaction required' }); return 0; }
          return _watch(s, e, o);
        };
      })();

      // Detect iOS and set class on <html> before any rendering — prevents Android getting safe-area padding
      (function() {
        var ua = navigator.userAgent;
        var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Mac OS X/.test(ua) && navigator.maxTouchPoints > 1);
        if (isIOS) {
          document.documentElement.classList.add('ios-device');
        }
      })();
    </script>



    <script>
      // Disable pinch-zoom and double-tap-zoom ONLY on mobile/touch devices (iOS & Android).
      // Desktop browsers are unaffected.
      (function() {
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || 
                       ('ontouchstart' in window && navigator.maxTouchPoints > 1);
        if (!isMobile) return;

        // Prevent pinch zoom (multi-touch scale gesture)
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent double-tap zoom by tracking tap timing
        var lastTap = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          var tag = e.target && e.target.tagName;
          // Allow double-tap on inputs, textareas, selects
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (now - lastTap < 300) {
            e.preventDefault();
          }
          lastTap = now;
        }, { passive: false });
      })();
    </script>

    <script>
      // Dynamic OG meta injection for event/seller link previews.
      // iMessage, WhatsApp etc. read OG tags at crawl time. This client-side
      // script updates the tags for users opening the link in a browser — it
      // won't affect server-side crawlers (which would need SSR), but it
      // ensures the page title and description update correctly in-browser.
      (function() {
        try {
          var path = window.location.pathname; // e.g. /events/abc123
          var search = window.location.search;
          var eventMatch = path.match(/^\/events\/([^/]+)/);
          var sellerParam = new URLSearchParams(search).get('seller');
          if (!eventMatch) return;
          var eventId = eventMatch[1];
          // Fetch event data from Base44 API to update meta tags
          var appId = (window.__B44_APP_ID__ || document.head.querySelector('script[data-app-id]')?.dataset?.appId || '69c45469fc66657973f432a4');
          fetch('https://app.base44.com/api/apps/' + appId + '/entities/Event/records?id=' + eventId + '&limit=1', {
            headers: { 'X-App-Id': appId }
          })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var ev = (data.records || data)[0];
            if (!ev) return;
            var sellerHint = sellerParam ? ' — Get tickets from your seller.' : '';
            var title = (ev.title || 'Event') + ' Tickets' + sellerHint;
            var img = (ev.images && ev.images[0]) || ev.cover_image || ev.flyer_url || '';
            var dateStr = '';
            if (ev.date) { try { dateStr = ' on ' + new Date(ev.date).toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'}); } catch(e){} }
            var venue = [ev.venue_name, ev.city, ev.state].filter(Boolean).join(', ');
            var artist = ev.artist_name || (ev.lineup && ev.lineup[0]) || '';
            var desc = 'Join us' + (artist ? ' for ' + artist : '') + dateStr + (venue ? ' at ' + venue : '') + '. Get your tickets now on Reizor.';
            var url = 'https://reizor.com/events/' + eventId + (sellerParam ? '?seller=' + sellerParam : '');

            function setMeta(prop, val, isName) {
              var sel = isName ? '[name="' + prop + '"]' : '[property="' + prop + '"]';
              var el = document.head.querySelector(sel);
              if (!el) { el = document.createElement('meta'); if (isName) el.setAttribute('name', prop); else el.setAttribute('property', prop); document.head.appendChild(el); }
              el.setAttribute('content', val);
            }

            document.title = title;
            setMeta('og:title', title);
            setMeta('og:description', desc);
            setMeta('og:url', url);
            if (img) setMeta('og:image', img);
            setMeta('twitter:title', title, true);
            setMeta('twitter:description', desc, true);
            if (img) setMeta('twitter:image', img, true);
          }).catch(function(){});
        } catch(e) {}
      })();
    </script>

    <script>

          { pageLanguage: "en", autoDisplay: false },

  <body>
    <!-- Hidden GT mount point — must exist but stays invisible -->
    <div id="google_translate_element" style="display:none;visibility:hidden;height:0;overflow:hidden;"></div>
    <!-- Startup splash overlay — visible from first paint until the React app signals ready -->
    <div id="app-splash" aria-hidden="true">
      <div id="app-splash-logo">REIZOR</div>
      <div id="app-splash-spinner"></div>
    </div>
    <script>
      // Fade out and remove the splash. Called by React once the app is ready.
      // Safety net: auto-hide after 8s if React never mounts (e.g. JS error).
      (function() {
        var hidden = false;
        window.__hideAppSplash = function() {
          if (hidden) return;
          hidden = true;
          var s = document.getElementById('app-splash');
          if (!s) return;
          s.classList.add('fade-out');
          setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
        };
        setTimeout(window.__hideAppSplash, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
